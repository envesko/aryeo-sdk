name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Manifest, generation and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Validates the manifest, scans evidence for credentials, proves the
      # generated output is not stale, and typechecks what was generated.
      - run: npm test

      # npm test proves generation is current against the committed tree. This
      # proves the tree is actually what the emitters produce, by regenerating
      # and diffing, which catches a hand edit to generated code.
      - name: Generated code is not hand edited
        run: |
          npm run generate
          if ! git diff --quiet -- packages; then
            echo "Generated output differs after regeneration. Do not edit generated files by hand."
            git --no-pager diff --stat -- packages
            exit 1
          fi

  secrets:
    name: Evidence carries no credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check the scanner still behaves
        run: node tools/scan-evidence.mjs --self-test

      - name: Scan evidence for credentials
        run: node tools/scan-evidence.mjs

  php:
    name: PHP client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: curl, json, mbstring
          coverage: none

      # Generated PHP is committed, so it can be linted without regenerating.
      - name: Lint every PHP file
        run: |
          for f in packages/client-php/src/*.php packages/client-php/src/Generated/*.php; do
            php -l "$f" > /dev/null || exit 1
          done
          echo "all PHP files parse"

      - name: Conformance
        run: php conformance/cases/php-client.php
