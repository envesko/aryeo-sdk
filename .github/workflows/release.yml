name: Release

# Tag the repository to release. The tag is the version.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Nothing publishes on a push to main, deliberately: a release should be a
# decision somebody made, not a side effect of merging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Build and check without publishing"
        type: boolean
        default: true

jobs:
  verify:
    name: Everything must pass first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: curl, json, mbstring
          coverage: none
      - run: npm ci
      - run: npm test
      - run: php conformance/cases/php-client.php

      # A release must match the manifest it claims to be generated from.
      - name: Generated output is current
        run: |
          npm run generate
          git diff --quiet -- packages || {
            echo "Generated output is stale. Regenerate and commit before tagging."
            exit 1
          }

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --workspace packages/client-ts --no-git-tag-version
          echo "Releasing $VERSION"

      - name: Publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dryRun }}
        run: npm publish --workspace packages/client-ts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || inputs.dryRun }}
        run: npm publish --workspace packages/client-ts --dry-run --access public

  # Packagist reads composer.json from the root of this repository and picks up
  # the tag on its own, so there is nothing to publish here. .gitattributes
  # keeps everything that is not the PHP package out of the archive.
  packagist:
    name: Packagist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Confirm the archive carries only the PHP package
        run: |
          git archive --format=tar HEAD | tar -t > /tmp/files.txt
          if grep -qE '^(codegen|manifest|evidence|conformance|tools)/' /tmp/files.txt; then
            echo "The Composer archive carries files it should not. Check .gitattributes export-ignore."
            grep -E '^(codegen|manifest|evidence|conformance|tools)/' /tmp/files.txt | head
            exit 1
          fi
          echo "Archive contains $(wc -l < /tmp/files.txt) files:"
          cat /tmp/files.txt
