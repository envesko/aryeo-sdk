name: Release

# Tag the repository to release. The tag is the version.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Nothing publishes on a push to main, deliberately: a release should be a
# decision somebody made, not a side effect of merging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Build and check without publishing"
        type: boolean
        default: true

jobs:
  verify:
    name: Everything must pass first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: curl, json, mbstring
          coverage: none
      - run: npm ci
      - run: npm test
      - run: php conformance/cases/php-client.php

      # A release must match the manifest it claims to be generated from.
      - name: Generated output is current
        run: |
          npm run generate
          git diff --quiet -- packages || {
            echo "Generated output is stale. Regenerate and commit before tagging."
            exit 1
          }

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --workspace packages/client-ts --no-git-tag-version
          echo "Releasing $VERSION"

      - name: Publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dryRun }}
        run: npm publish --workspace packages/client-ts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || inputs.dryRun }}
        run: npm publish --workspace packages/client-ts --dry-run --access public

  php-mirror:
    name: Push the PHP mirror
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Packagist expects one repository per package, so the PHP package is
      # split out to a read-only mirror. Development happens here; nobody
      # commits to the mirror.
      - name: Split and push
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dryRun }}
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "MIRROR_PUSH_TOKEN is not set. Skipping the mirror."
            exit 0
          fi
          git config user.name "Brandin"
          git config user.email "brandin@envesko.com"
          BRANCH=$(git subtree split --prefix=packages/client-php HEAD)
          git push "https://x-access-token:${MIRROR_TOKEN}@github.com/envesko/aryeo-php.git" \
            "${BRANCH}:refs/heads/main" --force
          git push "https://x-access-token:${MIRROR_TOKEN}@github.com/envesko/aryeo-php.git" \
            "${BRANCH}:refs/tags/${GITHUB_REF_NAME}"

      - name: Dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || inputs.dryRun }}
        run: |
          BRANCH=$(git subtree split --prefix=packages/client-php HEAD)
          echo "Would push ${BRANCH} to envesko/aryeo-php"
          git log --oneline -3 "$BRANCH"
